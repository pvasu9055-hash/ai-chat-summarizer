<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>ChatApp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#111b21; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Segoe UI',sans-serif; }
        .app { width:100%; max-width:420px; height:100vh; max-height:820px; display:flex; flex-direction:column; background:#0b141a; box-shadow:0 0 60px rgba(0,0,0,0.6); }
        .topbar { background:#202c33; padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #2a3942; }
        .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#00a884,#00cf9d); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:white; }
        .contact-name { color:#e9edef; font-size:1rem; font-weight:600; }
        .contact-status { color:#00a884; font-size:0.75rem; }
        .topbar-actions { margin-left:auto; display:flex; gap:18px; }
        .topbar-actions span { color:#aebac1; font-size:18px; cursor:pointer; }
        .chat-area { flex:1; overflow-y:auto; padding:12px 10px; background:#0b141a; display:flex; flex-direction:column; gap:3px; }
        .chat-area::-webkit-scrollbar { width:4px; }
        .chat-area::-webkit-scrollbar-thumb { background:#374045; border-radius:2px; }
        .date-badge { text-align:center; margin:8px 0; }
        .date-badge span { background:#182229; color:#8696a0; font-size:0.7rem; padding:4px 10px; border-radius:8px; }
        .msg-row { display:flex; margin-bottom:2px; }
        .msg-row.me { justify-content:flex-end; }
        .msg-row.them { justify-content:flex-start; }
        .bubble { max-width:75%; padding:7px 12px 22px; border-radius:8px; position:relative; font-size:0.875rem; line-height:1.45; word-break:break-word; }
        .msg-row.me .bubble { background:#005c4b; color:#e9edef; border-bottom-right-radius:2px; }
        .msg-row.them .bubble { background:#202c33; color:#e9edef; border-bottom-left-radius:2px; }
        .bubble .time { position:absolute; bottom:4px; right:8px; font-size:0.65rem; color:#8696a0; }
        .msg-row.me .bubble .time::after { content:' ✓✓'; color:#53bdeb; }
        .sender-name { font-size:0.75rem; font-weight:600; color:#00a884; margin-bottom:3px; }
        .system-msg { text-align:center; color:#8696a0; font-size:0.75rem; margin:6px 0; }
        .summarize-bar { background:#182229; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #2a3942; }
        .summarize-bar span { color:#8696a0; font-size:0.78rem; }
        .summarize-btn { background:linear-gradient(135deg,#00a884,#00cf9d); color:white; border:none; padding:6px 16px; border-radius:20px; font-size:0.8rem; font-weight:600; cursor:pointer; }
        .summarize-btn:disabled { opacity:0.5; }
        .bottom-bar { background:#202c33; padding:8px 10px; display:flex; align-items:center; gap:8px; border-top:1px solid #2a3942; }
        .input-wrap { flex:1; background:#2a3942; border-radius:24px; display:flex; align-items:center; padding:0 14px; gap:8px; }
        #msgInput { flex:1; background:none; border:none; outline:none; color:#e9edef; font-size:0.95rem; padding:10px 0; font-family:inherit; resize:none; max-height:80px; }
        #msgInput::placeholder { color:#8696a0; }
        .send-btn { width:44px; height:44px; border-radius:50%; background:#00a884; border:none; cursor:pointer; font-size:18px; color:white; }
        .send-btn:hover { background:#00cf9d; }
        .summary-bubble { background:#1a2e22; border:1px solid #00a88450; border-radius:12px; padding:14px 16px; margin:8px 0; color:#e9edef; font-size:0.82rem; line-height:1.7; }
        .summary-title { color:#00a884; font-weight:700; font-size:0.8rem; text-transform:uppercase; margin-bottom:8px; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .msg-row, .summary-bubble { animation:fadeInUp 0.2s ease-out; }

        /* NAME MODAL */
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:100; }
        .modal-box { background:#202c33; border-radius:16px; padding:32px 28px; width:300px; text-align:center; }
        .modal-box h2 { color:#e9edef; margin-bottom:8px; }
        .modal-box p { color:#8696a0; font-size:0.85rem; margin-bottom:20px; }
        .modal-box input { width:100%; padding:12px 16px; border-radius:24px; border:none; background:#2a3942; color:#e9edef; font-size:1rem; outline:none; margin-bottom:16px; }
        .modal-box button { width:100%; padding:12px; border-radius:24px; border:none; background:#00a884; color:white; font-size:1rem; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>

<!-- NAME MODAL -->
<div class="modal" id="nameModal">
    <div class="modal-box">
        <h2>👋 Welcome!</h2>
        <p>Enter your name to join the chat</p>
        <input type="text" id="nameInput" placeholder="Your name..." maxlength="20"/>
        <button onclick="joinChat()">Join Chat ➤</button>
    </div>
</div>

<div class="app">
    <div class="topbar">
        <div class="avatar">G</div>
        <div>
            <div class="contact-name">Project Group 💬</div>
            <div class="contact-status" id="onlineStatus">connecting...</div>
        </div>
        <div class="topbar-actions">
            <span>📹</span><span>📞</span><span>⋮</span>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="date-badge"><span>TODAY</span></div>
    </div>

    <div class="summarize-bar">
        <span>✨ AI Summary</span>
        <button class="summarize-btn" id="summarizeBtn" onclick="summarizeChat()">Summarize Chat</button>
    </div>

    <div class="bottom-bar">
        <div class="input-wrap">
            <span style="color:#8696a0;font-size:20px">😊</span>
            <textarea id="msgInput" placeholder="Message" rows="1"
                      onkeydown="handleKey(event)"
                      oninput="autoResize(this)"></textarea>
            <span style="color:#8696a0;font-size:18px">📎</span>
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    let stompClient = null;
    let myName = '';
    const chatArea = document.getElementById('chatArea');

    function joinChat() {
        const name = document.getElementById('nameInput').value.trim();
        if (!name) return;
        myName = name;
        document.getElementById('nameModal').style.display = 'none';
        connect();
    }

    document.getElementById('nameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') joinChat();
    });

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, () => {
            document.getElementById('onlineStatus').textContent = '● online';
            stompClient.subscribe('/topic/messages', msg => {
                const data = JSON.parse(msg.body);
                showMessage(data.name, data.text, data.name === myName ? 'me' : 'them');
            });
            // Announce join
            stompClient.send("/app/sendMessage", {}, JSON.stringify({ name: 'System', text: myName + ' joined the chat 👋' }));
        });
    }

    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollDown() {
        setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 50);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 80) + 'px';
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function escapeHtml(t) {
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function showMessage(name, text, type) {
        if (name === 'System') {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            chatArea.appendChild(div);
        } else {
            const row = document.createElement('div');
            row.className = `msg-row ${type}`;
            row.innerHTML = `<div class="bubble">
        ${type === 'them' ? `<div class="sender-name">${escapeHtml(name)}</div>` : ''}
        ${escapeHtml(text)}
        <span class="time">${getTime()}</span>
      </div>`;
            chatArea.appendChild(row);
        }
        scrollDown();
    }

    function sendMessage() {
        const text = document.getElementById('msgInput').value.trim();
        if (!text || !stompClient) return;
        stompClient.send("/app/sendMessage", {}, JSON.stringify({ name: myName, text: text }));
        document.getElementById('msgInput').value = '';
        document.getElementById('msgInput').style.height = 'auto';
    }

    async function summarizeChat() {
        const btn = document.getElementById('summarizeBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Summarizing...';
        const bubbles = chatArea.querySelectorAll('.bubble');
        let chatText = '';
        bubbles.forEach(b => {
            const sender = b.querySelector('.sender-name');
            const name = sender ? sender.textContent : myName;
            let text = '';
            b.childNodes.forEach(n => { if (n.nodeType === 3) text += n.textContent.trim(); });
            if (text) chatText += `${name}: ${text}\n`;
        });
        try {
            const res = await fetch('/summarize', { method:'POST', headers:{'Content-Type':'text/plain'}, body: chatText });
            const summary = await res.text();
            const el = document.createElement('div');
            el.className = 'summary-bubble';
            el.innerHTML = `<div class="summary-title">🤖 AI Summary</div>${summary.replace(/\n/g,'<br>')}`;
            chatArea.appendChild(el);
            scrollDown();
        } catch(e) { alert('Error: ' + e.message); }
        btn.disabled = false;
        btn.textContent = 'Summarize Chat';
    }
</script>
</body>
</html>
