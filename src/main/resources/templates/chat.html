<!DOCTYPE html>
<html>
<head>
<title>AI Chat Summarizer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    background: linear-gradient(135deg, #075E54, #128C7E);
    color: white;
    padding: 16px 20px;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.status-bar {
    text-align: center;
    font-size: 12px;
    padding: 5px;
    font-weight: 500;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
}

.main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

.chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ddd;
}

.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #e5ddd5;
}

.message {
    max-width: 65%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    word-wrap: break-word;
}

.me {
    background: #dcf8c6;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
}

.other {
    background: #ffffff;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
}

.message .name {
    font-size: 12px;
    font-weight: bold;
    color: #075E54;
    margin-bottom: 3px;
}

.message .time {
    font-size: 10px;
    color: #999;
    text-align: right;
    margin-top: 4px;
}

.input-area {
    display: flex;
    padding: 10px 14px;
    background: #f0f0f0;
    gap: 8px;
    align-items: center;
    border-top: 1px solid #ddd;
}

.input-area input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 14px;
    outline: none;
    background: white;
}

.input-area input:focus { border-color: #128C7E; }

.send-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: #25D366;
    color: white;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.send-btn:hover { background: #1ebe5d; }

.summary-section {
    width: 320px;
    display: flex;
    flex-direction: column;
    background: #fff;
}

.summary-header {
    background: #075E54;
    color: white;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: bold;
}

.summary-box {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.summary-empty {
    text-align: center;
    color: #aaa;
    margin-top: 40px;
    font-size: 14px;
}

.summary-card {
    background: #f8fff8;
    border: 1px solid #c3e6c3;
    border-left: 4px solid #25D366;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.6;
    color: #333;
}

.summary-card .summary-time {
    font-size: 11px;
    color: #999;
    margin-bottom: 6px;
}

.summarize-btn {
    margin: 12px;
    padding: 12px;
    background: linear-gradient(135deg, #075E54, #128C7E);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.summarize-btn:hover { opacity: 0.9; }
.summarize-btn:disabled { background: #ccc; cursor: not-allowed; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
</style>
</head>
<body>

<div class="header">💬 AI Chat Summarizer</div>
<div class="status-bar" id="status" style="color:#999;">Connecting...</div>

<div class="main">
    <div class="chat-section">
        <div id="chatBox" class="chat-box"></div>
        <div class="input-area">
            <input id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">&#10148;</button>
        </div>
    </div>

    <div class="summary-section">
        <div class="summary-header">🤖 AI Summary</div>
        <div id="summaryBox" class="summary-box">
            <div class="summary-empty">Send messages and click<br><b>Summarize</b> to get a summary!</div>
        </div>
        <button class="summarize-btn" id="sumBtn" onclick="getSummary()">✨ Summarize Chat</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
let username = prompt("Enter your name");
if (!username || username.trim() === "") username = "User";

let stompClient = null;
let allMessages = [];

function getTime() {
    let now = new Date();
    return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

function connect() {
    let socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function(frame) {
        document.getElementById("status").innerText = "Connected as " + username;
        document.getElementById("status").style.color = "green";

        stompClient.subscribe('/topic/messages', function(message) {
            let data = JSON.parse(message.body);
            showMessage(data.sender, data.content, data.sender === username);
            allMessages.push(data.sender + ": " + data.content);
        });

    }, function(error) {
        document.getElementById("status").innerText = "Disconnected. Retrying...";
        document.getElementById("status").style.color = "red";
        setTimeout(connect, 3000);
    });
}

function sendMessage() {
    let input = document.getElementById("messageInput");
    let message = input.value.trim();
    if (message === "") return;

    if (stompClient && stompClient.connected) {
        stompClient.send("/app/sendMessage", {}, JSON.stringify({
            sender: username,
            content: message
        }));
    } else {
        showMessage(username, message, true);
        allMessages.push(username + ": " + message);
    }
    input.value = "";
}

function showMessage(sender, content, isMe) {
    let chat = document.getElementById("chatBox");
    let div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    div.innerHTML = '<div class="name">' + sender + '</div>' + content + '<div class="time">' + getTime() + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function getSummary() {
    if (allMessages.length === 0) {
        alert("No messages to summarize yet!");
        return;
    }
    let btn = document.getElementById("sumBtn");
    btn.disabled = true;
    btn.innerText = "Summarizing...";

    fetch("/summarize", {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: allMessages.join("\n")
    })
    .then(res => res.text())
    .then(data => {
        let box = document.getElementById("summaryBox");
        box.innerHTML = "";
        let card = document.createElement("div");
        card.className = "summary-card";
        card.innerHTML = '<div class="summary-time">Generated at ' + getTime() + ' — ' + allMessages.length + ' messages</div>' + data.replace(/\n/g, '<br>');
        box.appendChild(card);
        btn.disabled = false;
        btn.innerText = "✨ Summarize Chat";
    })
    .catch(err => {
        btn.disabled = false;
        btn.innerText = "✨ Summarize Chat";
    });
}

connect();
</script>
</body>
</html>
