<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chat Summarizer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0e14;
    --surface: #12161f;
    --surface2: #1a1f2b;
    --surface3: #232a38;
    --border: #262d3d;
    --accent: #00d9a3;
    --accent2: #7c5cff;
    --accent3: #f5a623;
    --text: #eef1f6;
    --text-muted: #7d8697;
    --me-bg: linear-gradient(135deg, #0f3d34, #0c2e28);
    --me-border: #00d9a355;
    --other-bg: #1a1f2b;
    --other-border: #262d3d;
    --danger: #ff5c72;
    --success: #2ed889;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

/* ===== AUTH OVERLAY ===== */
#authOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at 30% 20%, #0f2a24 0%, #0b0e14 60%);
    display: flex; align-items: center; justify-content: center;
}
.auth-card {
    width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 36px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.auth-logo {
    width: 52px; height: 52px; border-radius: 14px; margin-bottom: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #05130f;
}
.auth-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.auth-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
.auth-field { margin-bottom: 12px; }
.auth-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px; }
.auth-field input {
    width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    font-family: 'DM Sans', sans-serif;
}
.auth-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #00d9a322; }
#authError { color: var(--danger); font-size: 12px; min-height: 16px; margin: 6px 0 10px; }
.auth-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 700; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), #00b48a); color: #05130f; cursor: pointer;
    transition: transform .15s, opacity .15s; margin-top: 4px;
}
.auth-btn:hover { transform: translateY(-1px); opacity: 0.94; }
.auth-switch { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-top: 18px; }
.auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; }

/* ===== APP SHELL ===== */
#app { display: none; height: 100vh; flex-direction: column; }
#app.active { display: flex; }

.topbar {
    height: 58px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.topbar-title { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
.me-pill {
    display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 12px 6px 6px; font-size: 12.5px;
}
.me-avatar {
    width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--accent3), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #05130f;
}
.logout-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; margin-left: 6px; }
.logout-btn:hover { color: var(--danger); }

.body-wrap { flex: 1; display: flex; overflow: hidden; }

/* ===== SIDEBAR ===== */
.sidebar { width: 300px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.sidebar-tab {
    flex: 1; padding: 12px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border-bottom: 2px solid transparent; position: relative; transition: color .15s;
}
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-badge {
    background: var(--danger); color: white; font-size: 10px; font-weight: 700; border-radius: 10px;
    padding: 1px 6px; margin-left: 5px;
}
.sidebar-search { padding: 12px; border-bottom: 1px solid var(--border); }
.sidebar-search input {
    width: 100%; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 6px; }

.contact-row {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
    transition: background .12s; margin-bottom: 2px;
}
.contact-row:hover { background: var(--surface2); }
.contact-row.selected { background: var(--surface3); }
.contact-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent2), #a78bfa);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white;
}
.contact-info { min-width: 0; flex: 1; }
.contact-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-email { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.request-actions { display: flex; gap: 6px; }
.req-btn {
    border: none; border-radius: 7px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
}
.req-btn.accept { background: var(--accent); color: #05130f; }
.req-btn.add { background: var(--accent2); color: white; }
.req-btn.add:disabled { background: var(--surface3); color: var(--text-muted); cursor: default; }

.sidebar-empty { text-align: center; color: var(--text-muted); font-size: 12.5px; padding: 30px 16px; }
.sidebar-empty .e { font-size: 28px; margin-bottom: 8px; }

/* ===== CHAT AREA ===== */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header {
    height: 58px; flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; padding: 0 18px; gap: 12px;
}
.chat-header .contact-avatar { width: 34px; height: 34px; font-size: 13px; }
.chat-header-name { font-size: 14.5px; font-weight: 700; }
.chat-header-sub { font-size: 11px; color: var(--text-muted); }

.chat-box { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }

.no-conv-selected {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted); gap: 8px; text-align: center; padding: 40px;
}
.no-conv-selected .e { font-size: 46px; margin-bottom: 6px; }
.no-conv-selected strong { color: var(--text); font-size: 16px; }

.message {
    max-width: 66%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55;
    word-wrap: break-word; animation: msgIn 0.2s ease; border: 1px solid transparent;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.me { background: var(--me-bg); border-color: var(--me-border); align-self: flex-end; border-bottom-right-radius: 4px; }
.other { background: var(--other-bg); border-color: var(--other-border); align-self: flex-start; border-bottom-left-radius: 4px; }
.message .name { font-size: 11px; font-weight: 700; color: var(--accent3); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
.me .name { color: var(--accent); }
.message .time { font-size: 10px; color: var(--text-muted); text-align: right; margin-top: 5px; font-family: 'JetBrains Mono', monospace; }

.input-area { display: flex; padding: 14px 18px; background: var(--surface); border-top: 1px solid var(--border); gap: 10px; align-items: center; }
.input-area input {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px;
    outline: none; background: var(--surface2); color: var(--text); transition: border-color .15s;
}
.input-area input:focus { border-color: var(--accent); }
.send-btn {
    width: 44px; height: 44px; border: none; background: linear-gradient(135deg, var(--accent), #00b48a);
    color: #05130f; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
}
.send-btn:hover { transform: scale(1.06); }

/* ===== AI PANEL ===== */
.ai-panel { width: 310px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.ai-panel-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.ai-panel-title { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.ai-badge { font-size: 9.5px; background: linear-gradient(135deg, var(--accent2), #a78bfa); color: white; padding: 2px 7px; border-radius: 5px; font-weight: 700; }
.ai-btn-row { display: flex; gap: 8px; padding: 12px; }
.ai-btn {
    flex: 1; padding: 10px; border: none; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity .15s, transform .15s;
}
.ai-btn.summarize { background: linear-gradient(135deg, var(--accent2), #a78bfa); color: white; }
.ai-btn.actions { background: var(--surface3); color: var(--text); border: 1px solid var(--border); }
.ai-btn:hover { transform: translateY(-1px); opacity: 0.92; }
.ai-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.ai-content { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.ai-empty { text-align: center; color: var(--text-muted); font-size: 12.5px; padding: 30px 14px; }
.ai-empty .e { font-size: 30px; margin-bottom: 8px; }
.ai-card {
    background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent2);
    border-radius: 10px; padding: 12px; font-size: 12.5px; line-height: 1.6; margin-bottom: 10px; animation: msgIn .25s ease;
}
.action-card { border-left-color: var(--accent3); }
.action-card .task { font-weight: 600; margin-bottom: 6px; }
.action-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.action-tag { font-size: 10px; background: var(--surface3); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--surface3); border: 1px solid var(--border); color: var(--text); padding: 10px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 500; transition: transform .3s ease; z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">AI</div>
    <div class="auth-title">AI Chat Summarizer</div>
    <div class="auth-subtitle" id="authSubtitle">Login to continue</div>

    <div class="auth-field" id="usernameField" style="display:none;">
      <label>Username</label>
      <input id="authUsername" type="text" placeholder="yourname">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input id="authEmail" type="email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input id="authPassword" type="password" placeholder="********">
    </div>

    <div id="authError"></div>
    <button class="auth-btn" id="authSubmitBtn" onclick="submitAuth()">Login</button>

    <div class="auth-switch">
      <span id="authToggleText">Don't have an account?</span>
      <a href="#" onclick="toggleAuthMode(); return false;" id="authToggleLink">Register</a>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo"></div>
      <div class="topbar-title">AI Chat Summarizer</div>
    </div>
    <div class="me-pill">
      <div class="me-avatar" id="meAvatar">?</div>
      <span id="meLabel"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="body-wrap">
    <div class="sidebar">
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" id="tabContacts" onclick="switchTab('contacts')">Contacts</div>
        <div class="sidebar-tab" id="tabRequests" onclick="switchTab('requests')">Requests<span class="tab-badge" id="reqBadge" style="display:none;">0</span></div>
        <div class="sidebar-tab" id="tabSearch" onclick="switchTab('search')">Add</div>
      </div>

      <div class="sidebar-search" id="searchBox" style="display:none;">
        <input id="searchInput" placeholder="Search by username or email..." oninput="onSearchInput()">
      </div>

      <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chatHeader" style="display:none;">
        <div class="contact-avatar" id="chatAvatar"></div>
        <div>
          <div class="chat-header-name" id="chatHeaderName"></div>
          <div class="chat-header-sub" id="chatHeaderSub"></div>
        </div>
      </div>

      <div class="chat-box" id="chatBox" style="display:none;"></div>

      <div class="no-conv-selected" id="noConvSelected">
        <div class="e">[chat]</div>
        <strong>Select a contact to start chatting</strong>
        <div>Or add someone new from the "Add" tab</div>
      </div>

      <div class="input-area" id="inputArea" style="display:none;">
        <input id="messageInput" placeholder="Type a message..." maxlength="500"
               onkeydown="if(event.key==='Enter'){ sendMessage(); }">
        <button class="send-btn" onclick="sendMessage()">&gt;</button>
      </div>
    </div>

    <div class="ai-panel">
      <div class="ai-panel-header">
        <div class="ai-panel-title">[AI] Assistant <span class="ai-badge">NLP</span></div>
      </div>
      <div class="ai-btn-row">
        <button class="ai-btn summarize" id="sumBtn" onclick="getSummary()">Summarize</button>
        <button class="ai-btn actions" id="actBtn" onclick="getActions()">Actions</button>
      </div>
      <div class="ai-content" id="aiContent">
        <div class="ai-empty"><div class="e">[brain]</div>Select a chat, then generate a summary or extract action items.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
const BACKEND_URL = window.BACKEND_URL || "http://localhost:8080";

let myEmail = "", myUsername = "";
let authMode = "login";
let stompClient = null;
let currentSub = null;
let currentConversationId = null;
let currentContactName = "";
let contacts = [];
let pending = [];

function toggleAuthMode() {
    authMode = authMode === "login" ? "register" : "login";
    document.getElementById("authSubtitle").textContent = authMode === "login" ? "Login to continue" : "Create an account";
    document.getElementById("authSubmitBtn").textContent = authMode === "login" ? "Login" : "Register";
    document.getElementById("authToggleText").textContent = authMode === "login" ? "Don't have an account?" : "Already have an account?";
    document.getElementById("authToggleLink").textContent = authMode === "login" ? "Register" : "Login";
    document.getElementById("usernameField").style.display = authMode === "register" ? "block" : "none";
    document.getElementById("authError").textContent = "";
}

function submitAuth() {
    const uname = document.getElementById("authUsername").value.trim();
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPassword").value;
    const errBox = document.getElementById("authError");
    errBox.style.color = "#ff5c72";
    errBox.textContent = "";

    if (authMode === "login" && (!email || !pass)) { errBox.textContent = "Fill in email and password."; return; }
    if (authMode === "register" && (!uname || !email || !pass)) { errBox.textContent = "Fill in all fields."; return; }

    const endpoint = authMode === "login" ? "/login" : "/register";
    const payload = authMode === "login" ? { email, password: pass } : { username: uname, email, password: pass };

    fetch(BACKEND_URL + endpoint, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (!data.success) { errBox.textContent = data.message || "Something went wrong."; return; }
        if (authMode === "register") {
            errBox.style.color = "#2ed889";
            errBox.textContent = "Registered! Now click Login.";
            toggleAuthMode();
            return;
        }
        myEmail = email;
        myUsername = data.username || email;
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("app").classList.add("active");
        document.getElementById("meLabel").textContent = myUsername;
        document.getElementById("meAvatar").textContent = myUsername.charAt(0).toUpperCase();
        connectSocket();
        loadContacts();
        loadPending();
    })
    .catch(() => { errBox.textContent = "Could not reach server."; });
}

function logout() { location.reload(); }

function switchTab(tab) {
    document.getElementById("tabContacts").classList.toggle("active", tab === "contacts");
    document.getElementById("tabRequests").classList.toggle("active", tab === "requests");
    document.getElementById("tabSearch").classList.toggle("active", tab === "search");
    document.getElementById("searchBox").style.display = tab === "search" ? "block" : "none";
    if (tab === "contacts") renderContacts();
    if (tab === "requests") renderPending();
    if (tab === "search") { document.getElementById("sidebarList").innerHTML = '<div class="sidebar-empty"><div class="e">[search]</div>Type a username or email above.</div>'; }
}

function loadContacts() {
    fetch(BACKEND_URL + "/contacts/list?myEmail=" + encodeURIComponent(myEmail))
        .then(r => r.json()).then(data => { contacts = data; renderContacts(); })
        .catch(() => {});
}

function loadPending() {
    fetch(BACKEND_URL + "/contacts/pending?myEmail=" + encodeURIComponent(myEmail))
        .then(r => r.json()).then(data => {
            pending = data;
            const badge = document.getElementById("reqBadge");
            if (pending.length > 0) { badge.style.display = "inline-block"; badge.textContent = pending.length; }
            else { badge.style.display = "none"; }
        })
        .catch(() => {});
}

function renderContacts() {
    const box = document.getElementById("sidebarList");
    if (contacts.length === 0) {
        box.innerHTML = '<div class="sidebar-empty"><div class="e">[users]</div>No contacts yet.<br>Go to "Add" to find people.</div>';
        return;
    }
    box.innerHTML = "";
    contacts.forEach(c => {
        const row = document.createElement("div");
        row.className = "contact-row" + (c.conversationId === currentConversationId ? " selected" : "");
        row.onclick = () => openConversation(c.conversationId, c.username, c.email);
        row.innerHTML =
            '<div class="contact-avatar">' + c.username.charAt(0).toUpperCase() + '</div>' +
            '<div class="contact-info"><div class="contact-name">' + escapeHtml(c.username) + '</div>' +
            '<div class="contact-email">' + escapeHtml(c.email) + '</div></div>';
        box.appendChild(row);
    });
}

function renderPending() {
    const box = document.getElementById("sidebarList");
    if (pending.length === 0) {
        box.innerHTML = '<div class="sidebar-empty"><div class="e">[inbox]</div>No pending requests.</div>';
        return;
    }
    box.innerHTML = "";
    pending.forEach(p => {
        const row = document.createElement("div");
        row.className = "contact-row";
        row.innerHTML =
            '<div class="contact-avatar">' + p.fromUsername.charAt(0).toUpperCase() + '</div>' +
            '<div class="contact-info"><div class="contact-name">' + escapeHtml(p.fromUsername) + '</div>' +
            '<div class="contact-email">' + escapeHtml(p.fromEmail) + '</div></div>' +
            '<div class="request-actions"><button class="req-btn accept">Accept</button></div>';
        row.querySelector(".req-btn.accept").onclick = (e) => { e.stopPropagation(); acceptRequest(p.requestId); };
        box.appendChild(row);
    });
}

function onSearchInput() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) { document.getElementById("sidebarList").innerHTML = '<div class="sidebar-empty"><div class="e">[search]</div>Type a username or email above.</div>'; return; }
    fetch(BACKEND_URL + "/contacts/search?query=" + encodeURIComponent(q) + "&myEmail=" + encodeURIComponent(myEmail))
        .then(r => r.json()).then(renderSearchResults).catch(() => {});
}

function renderSearchResults(results) {
    const box = document.getElementById("sidebarList");
    if (results.length === 0) { box.innerHTML = '<div class="sidebar-empty"><div class="e">[x]</div>No users found.</div>'; return; }
    box.innerHTML = "";
    results.forEach(u => {
        const isContact = contacts.some(c => c.email === u.email);
        const row = document.createElement("div");
        row.className = "contact-row";
        row.innerHTML =
            '<div class="contact-avatar">' + u.username.charAt(0).toUpperCase() + '</div>' +
            '<div class="contact-info"><div class="contact-name">' + escapeHtml(u.username) + '</div>' +
            '<div class="contact-email">' + escapeHtml(u.email) + '</div></div>' +
            '<div class="request-actions"><button class="req-btn add"' + (isContact ? ' disabled' : '') + '>' + (isContact ? 'Added' : 'Add') + '</button></div>';
        const btn = row.querySelector(".req-btn.add");
        if (!isContact) btn.onclick = (e) => { e.stopPropagation(); sendContactRequest(u.email, btn); };
        box.appendChild(row);
    });
}

function sendContactRequest(targetEmail, btn) {
    fetch(BACKEND_URL + "/contacts/request", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ myEmail, targetEmail })
    })
    .then(r => r.json()).then(data => {
        if (data.success) { btn.disabled = true; btn.textContent = "Requested"; showToast("Request sent!"); }
        else { showToast(data.message || "Could not send request."); }
    })
    .catch(() => showToast("Could not reach server."));
}

function acceptRequest(requestId) {
    fetch(BACKEND_URL + "/contacts/accept", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ requestId })
    })
    .then(r => r.json()).then(data => {
        if (data.success) {
            showToast("Contact added!");
            loadPending(); loadContacts();
            switchTab('contacts'); document.getElementById("tabContacts").classList.add("active"); document.getElementById("tabRequests").classList.remove("active");
        } else { showToast(data.message || "Could not accept."); }
    })
    .catch(() => showToast("Could not reach server."));
}

function openConversation(conversationId, contactUsername, contactEmail) {
    currentConversationId = conversationId;
    currentContactName = contactUsername;

    document.getElementById("noConvSelected").style.display = "none";
    document.getElementById("chatHeader").style.display = "flex";
    document.getElementById("chatBox").style.display = "flex";
    document.getElementById("inputArea").style.display = "flex";
    document.getElementById("chatAvatar").textContent = contactUsername.charAt(0).toUpperCase();
    document.getElementById("chatHeaderName").textContent = contactUsername;
    document.getElementById("chatHeaderSub").textContent = contactEmail;

    document.getElementById("aiContent").innerHTML = '<div class="ai-empty"><div class="e">[brain]</div>Click Summarize or Actions to analyze this conversation.</div>';

    renderContacts();
    loadMessages(conversationId);
    subscribeToConversation(conversationId);
}

function loadMessages(conversationId) {
    const box = document.getElementById("chatBox");
    box.innerHTML = "";
    fetch(BACKEND_URL + "/messages/" + conversationId)
        .then(r => r.json())
        .then(msgs => msgs.forEach(m => appendMessage(m.senderUsername, m.content, m.senderEmail === myEmail)))
        .catch(() => {});
}

function connectSocket() {
    const socket = new SockJS(BACKEND_URL + "/ws");
    stompClient = Stomp.over(socket);
    stompClient.debug = null;
    stompClient.connect({}, function() {}, function() { setTimeout(connectSocket, 3000); });
}

function subscribeToConversation(conversationId) {
    if (!stompClient || !stompClient.connected) { setTimeout(() => subscribeToConversation(conversationId), 400); return; }
    if (currentSub) currentSub.unsubscribe();
    currentSub = stompClient.subscribe("/topic/conversation/" + conversationId, function(message) {
        const data = JSON.parse(message.body);
        appendMessage(data.senderUsername, data.content, data.senderEmail === myEmail);
    });
}

function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text || !currentConversationId) return;
    if (stompClient && stompClient.connected) {
        stompClient.send("/app/chat/" + currentConversationId, {}, JSON.stringify({ senderEmail: myEmail, content: text }));
    } else {
        showToast("Not connected, try again.");
    }
    input.value = "";
}

function appendMessage(sender, content, isMe) {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = "message " + (isMe ? "me" : "other");
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    div.innerHTML = '<div class="name">' + escapeHtml(sender) + '</div>' + escapeHtml(content) + '<div class="time">' + time + '</div>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function getSummary() {
    if (!currentConversationId) { showToast("Select a chat first."); return; }
    const btn = document.getElementById("sumBtn");
    btn.disabled = true; btn.textContent = "...";
    fetch(BACKEND_URL + "/summarize/" + currentConversationId, { method: "POST" })
        .then(r => r.text())
        .then(text => {
            const content = document.getElementById("aiContent");
            const empty = content.querySelector(".ai-empty");
            if (empty) empty.remove();
            const card = document.createElement("div");
            card.className = "ai-card";
            card.innerHTML = '<div class="action-tag" style="margin-bottom:8px; display:inline-block;">SUMMARY</div><div>' + escapeHtml(text).replace(/\n/g,'<br>') + '</div>';
            content.insertBefore(card, content.firstChild);
            btn.disabled = false; btn.textContent = "Summarize";
        })
        .catch(() => { btn.disabled = false; btn.textContent = "Summarize"; showToast("Failed to summarize."); });
}

function getActions() {
    if (!currentConversationId) { showToast("Select a chat first."); return; }
    const btn = document.getElementById("actBtn");
    btn.disabled = true; btn.textContent = "...";
    fetch(BACKEND_URL + "/extractActions/" + currentConversationId, { method: "POST" })
        .then(r => r.text())
        .then(text => {
            const content = document.getElementById("aiContent");
            let items = [];
            try { items = JSON.parse(text); } catch(e) { items = []; }
            const empty = content.querySelector(".ai-empty");
            if (empty) empty.remove();
            if (items.length === 0) {
                const card = document.createElement("div");
                card.className = "ai-card";
                card.textContent = "No action items found.";
                content.insertBefore(card, content.firstChild);
            } else {
                items.reverse().forEach(item => {
                    const card = document.createElement("div");
                    card.className = "ai-card action-card";
                    card.innerHTML =
                        '<div class="task">' + escapeHtml(item.task || "") + '</div>' +
                        '<div class="action-meta">' +
                        '<span class="action-tag">' + escapeHtml(item.owner || "Unassigned") + '</span>' +
                        '<span class="action-tag">' + escapeHtml(item.deadline || "No deadline") + '</span>' +
                        '</div>';
                    content.insertBefore(card, content.firstChild);
                });
            }
            btn.disabled = false; btn.textContent = "Actions";
        })
        .catch(() => { btn.disabled = false; btn.textContent = "Actions"; showToast("Failed to extract actions."); });
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

function escapeHtml(text) {
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
